<!DOCTYPE html>
<html>
<head>
    <title>Crawler Dashboard</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .stats { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .chart { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .pages { background: white; padding: 20px; border-radius: 8px; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                 background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
                 max-width: 80%; max-height: 80%; overflow: auto; z-index: 1000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                   background: rgba(0,0,0,0.5); z-index: 999; }
        .close-btn { float: right; cursor: pointer; font-size: 24px; }
        h1 { color: #333; }
        .stat-item { display: inline-block; margin: 10px 20px; }
        .stat-value { font-size: 24px; font-weight: bold; color: #007bff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>
    <h1>🕷️ Web Crawler Dashboard</h1>
    <div class="stats" id="stats">Loading...</div>
    <div class="chart">
        <h2>Depth Distribution</h2>
        <img src="/chart" id="chart-img" style="max-width: 800px;" onerror="this.style.display='none'">
    </div>
    <div class="pages">
        <h2>Recent Pages</h2>
        <table id="pages-table">
            <tr><th>URL</th><th>Title</th><th>Depth</th></tr>
        </table>
    </div>
    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-content"></div>
    </div>
    <script>
        function updateStats() {
            fetch('/api/stats').then(r => r.json()).then(data => {
                document.getElementById('stats').innerHTML = `
                    <div class="stat-item">
                        <div>Total Pages</div>
                        <div class="stat-value">${data.total_pages}</div>
                    </div>
                    <div class="stat-item">
                        <div>Avg Depth</div>
                        <div class="stat-value">${data.avg_depth.toFixed(2)}</div>
                    </div>
                `;
            });
            fetch('/api/pages').then(r => r.json()).then(pages => {
                let html = '<tr><th>URL</th><th>Title</th><th>Depth</th></tr>';
                pages.forEach((p, i) => {
                    html += `<tr onclick="showDetails('${p.url}')" style="cursor:pointer">
                             <td>${p.url}</td><td>${p.title || 'N/A'}</td><td>${p.depth}</td></tr>`;
                });
                document.getElementById('pages-table').innerHTML = html;
            });
        }
        updateStats();
        setInterval(updateStats, 2000);
        
        function showDetails(url) {
            fetch('/api/pages').then(r => r.json()).then(pages => {
                const page = pages.find(p => p.url === url);
                if (page) {
                    document.getElementById('modal-content').innerHTML = `
                        <h2>${page.title || 'No Title'}</h2>
                        <p><strong>URL:</strong> <a href="${page.url}" target="_blank">${page.url}</a></p>
                        <p><strong>Status Code:</strong> ${page.status_code || 'N/A'}</p>
                        <p><strong>Depth:</strong> ${page.depth}</p>
                        <hr>
                        <h3>Captured Text:</h3>
                        <div style="max-height: 400px; overflow-y: auto; background: #f5f5f5; padding: 15px; border-radius: 4px;">
                            <pre style="white-space: pre-wrap; word-wrap: break-word;">${page.text || 'No text captured'}</pre>
                        </div>
                    `;
                    document.getElementById('modal').style.display = 'block';
                    document.getElementById('overlay').style.display = 'block';
                }
            });
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
